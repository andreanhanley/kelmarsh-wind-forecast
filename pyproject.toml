[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "windfc"
version = "0.1.0"
description = "Wind power forecasting for the Kelmarsh wind farm using archived weather forecasts"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hanley Andrean" }]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "requests",
    "pyarrow",       # fast Parquet files for the large SCADA data
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",     # lets VS Code notebooks use this environment
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]